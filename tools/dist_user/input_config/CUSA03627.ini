# The Last Guardian - keyboard/mouse and controller bindings.
# Format: <PS4 pad output> = <key or controller input>. F8 reloads this file in-game.

# --- Keyboard and mouse ---
# Mouse moves the camera (right stick). F7 toggles mouse capture.
mouse_to_joystick = right
# deadzone offset, speed, speed offset
mouse_movement_params = 0.5, 1, 0.125

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s

# Pad actions, named as in the game's Controls guide.
triangle = space
circle = e
circle = rightbutton
circle = backspace
cross = c
cross = enter
square = f
square = leftbutton
r1 = r
l3 = lctrl
r3 = middlebutton
l1 = q
l2 = z
r2 = x
touchpad_center = tab

pad_up = up
pad_down = down
pad_left = left
pad_right = right
pad_up = 1
pad_down = 2
pad_left = 3
pad_right = 4

options = escape

# --- Controller (Xbox, DualShock, DualSense, Switch Pro via SDL) ---
triangle = triangle
cross = cross
square = square
circle = circle
l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3
options = options
touchpad_center = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127
